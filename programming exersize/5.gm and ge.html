<!DOCTYPE html>
<html lang="en">
<head>
    <title>Document</title>
</head>
<body>

    <script>
    //5. Write a program to display "Good Morning" if time is before 12,else display "Good Evening".

   let no = Number(prompt("Enter the time:"));
    if (no < 12) {
        document.write("Good Morning");
        }
    else {
        document.write("Good Evening");
    }
    
    </script>
    
</body>
</html>
