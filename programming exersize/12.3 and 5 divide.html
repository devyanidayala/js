<body>

    <script>

    //12. Write a program to check whether a number is divisible by 3 and 5 using nested if.
    let num = Number(prompt("Enter the number:"));

   if(num%3==0){
    if(num%5==0){
        document.write('divisible by 3 and 5 number');
    }else{
        document.write('divisible by 5 number');
        
    }
   }else{
        document.write('divisible by 3 number');

   }
    </script>
    
</body>
