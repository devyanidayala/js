<!DOCTYPE html>
<html lang="en">
<head>
    <title>Document</title>
</head>
<body>
    
    <script>

    //7. Write a program to calculate grades using an else if ladder.
    let marks=Number(prompt("enter the marks:"));
    if(marks>=90){
        document.write(`grade A`);
    }
    else if(marks>=80){
        document.write(`grade B`);
    }
    else if(marks>=70){
        document.write(`grade C`);
    }
    else if(marks>=60){
        document.write(`grade D`);
    }
    else if(marks>=50){
        document.write(`grade E`);
    }else{
        document.write(`Failed`);
    }
    
    </script>
</body>
</html>
