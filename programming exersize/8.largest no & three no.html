<!DOCTYPE html>
<html lang="en">
<head>
    <title>Document</title>
</head>
<body>
    
    <script>
    //8. Write a program to find the largest of three numbers using nested if.
    let a=Number(prompt("enter the no a:-"));
    let b=Number(prompt("enter the no b:-"));
    let c=Number(prompt("enter the no c:-"));
    if(a>b){
        if(a>c){
            document.write(`a is big`);
        }else{
            document.write(`c is big`);
        }
    }
    else{
        if(b>c){
            document.write(`b is big`);
        }else{
            document.write(`c is big`);
        }
    }

    </script>
</body>
</html>
