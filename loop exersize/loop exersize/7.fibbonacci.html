<!DOCTYPE html>
<html lang="en">

<head>
    <title>Document</title>
</head>

<body>

    <script>
        //7. Factorial Program
        let num = 4;
        let fact = 1;

        for (let i = 1; i <= num; i++) {
            fact = fact * i;
        }

        document.write("Factorial = " + fact);
    </script>
</body>

</html>
