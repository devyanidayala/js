<!DOCTYPE html>
<html lang="en">
<head>
    <title>Document</title>
</head>
<body>
    
    <script>
        //2. Print Even Numbers from 1 to 10

        let i=1;

        for(i=1;i<=10;i++){
            if(i%2==0){
                document.write(i+"<br>");
            }
        }
    </script>
</body>
</html>
