<!DOCTYPE html>
<html lang="en">

<head>
    <title>Document</title>
</head>

<body>

    <script>
        //9. Fibonacci Series
        let n = 7;
        let a = 0, b = 1;

        for (let i = 1; i <= n; i++) {
            document.write(a);
            let c = a + b;
            a = b;
            b = c;
        }
    </script>
</body>

</html>
