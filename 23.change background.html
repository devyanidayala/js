
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Background Changer</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background-color: #FFFFFF;
            transition: background-color 0.3s ease;
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.8);
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            background-color: #333;
            color: white;
        }

        button:hover {
            background-color: #555;
        }
    </style>
</head>

<body id="back">

    <div class="container">
        <h1>Background Changer</h1>

        <h2>
            Background Color:
            <span id="color-code">#FFFFFF</span>
        </h2>

        <button onclick="changeBack()">Change Color</button>
    </div>

    <script>
        const generateRandomColor = () => {
            let hexCharacters = "0123456789ABCDEF";
            let hexColor = "#";

            for (let i = 0; i < 6; i++) {
                let randomIndex = Math.floor(
                    Math.random() * hexCharacters.length
                );
                hexColor += hexCharacters[randomIndex];
            }
            return hexColor;
        };

        const changeBack = () => {
            let newColor = generateRandomColor();

            document.getElementById("back").style.backgroundColor = newColor;

            document.getElementById("color-code").innerText = newColor;
        };

    </script>

</body>
</html>
