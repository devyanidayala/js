<!DOCTYPE html>
<html lang="en">
<head>
    <title>Document</title>
</head>
<body>

    <script>
        //10. Write a program to display the day of the week using switch.
    let days=Number(prompt("enter the number of days:-"));
    switch(days){
        case 1:
            document.write(`sunday`);
        break;
        case 2:
            document.write(`monday`);
        break;
        case 3:
            document.write(`tuesday`);
        break;
        case 4:
            document.write(`wendensday`);
        break;
        case 5:
            document.write(`thursday`);
        break;
        case 6:
            document.write(`friday`);
        break;
        case 7:
            document.write(`saturday`);
        break;
        default:
            document.write(`Invalid`);

    }
    </script>
    
</body>
</html>
