<!DOCTYPE html>
<html lang="en">

<head>
    <title>Document</title>
</head>

<body>

    <script>
        //8. Check Prime Number

        let n = 4, count = 0;

        for (let i = 1; i <= n; i++)
            if (n % i == 0) count++;

        document.write(count == 2 ? "Prime" : "Not Prime");
    </script>
</body>

</html>
