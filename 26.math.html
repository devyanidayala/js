        // ---------------------------------------------------
        // Common Arithmetic Methods

        // 1. Math.pow(x, y): Returns power of a number.
        let a = (Math.pow(2,4));
        console.log(a);

        // 2. Math.sqrt(x): Returns square root.
        let b = (Math.sqrt(25));
        console.log(b);

        // 3. Math.abs(x):Returns absolute (positive) value.
        let c = (Math.abs(25));
        console.log(c);

        // 4. Math.min(...):Returns smallest number.
        let d = (Math.min(25,5,88,2,1));
        console.log(d);

        // 5. Math.max(...): Returns largest number.
         let e = (Math.max(25,5,88,2,1));
