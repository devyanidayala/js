<!DOCTYPE html>
<html lang="en">
<head>
    <title>Document</title>
</head>
<body>
    
    <script>
    //13. Write a program to determine ticket price based on age using else if.
    let age=Number(prompt("enter the age:"));
    if(age<5){
        document.write(`ticket is free`);
    }
    else if(age<=12){
        document.write(`ticket price=50`);
    }
    else if(age<=18){
        document.write(`ticket price=100`);
    }
    else{
        document.write(`ticket price=150`);
    }
    </script>
</body>
</html>
