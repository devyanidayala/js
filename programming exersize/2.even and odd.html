    <script>

    //2. Write a program to check whether a number is even or odd using if...else.
    // let no=5
   let no=Number(prompt("enter the number a:"));
    if(no%2==0){
        document.write(`no is even`);
    }
    else{
        document.write(`no is odd`)
    }

    </script>
