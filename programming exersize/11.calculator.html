<!DOCTYPE html>
<html lang="en">
<head>
    <title>Document</title>
</head>
<body>

    <script>
    //11. Write a program to create a simple calculator using switch.
    let a=Number(prompt("enter the numner a:-"));
    let b=Number(prompt("enter the numner b:-"));
    let operator = prompt("Enter operator (+, -, *, /):");

    switch(operator){
        case "+":
            document.write(a+b);
            break;
        case "-":
            document.write(a-b);
            break;
        case "*":
            document.write(a*b);
            break;
        case "/":
            document.write(a/b);
            break;
        default:
            document.write('Invalid');

    }

    </script>
    
</body>
</html>
