<body>
    
    <script>

    //6. Write a program to check whether a year is a leap year using if...else.
    let year=Number(prompt("enter the year:-"));
    if(year%2==0){
        document.write(`this year is leap`);
    }
    else{
        document.write(`this year is not leap`);
    }

    </script>
</body>
